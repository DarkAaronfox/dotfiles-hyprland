# Fixed scheme (not matugen-derived) matching this project's own
# black/white/red palette (bg #000000, text #ffffff, single
# accent #ff453a): the red/green/blue ANSI slots all collapse to the one
# accent color, everything else is a plain black-to-white grayscale ramp.
background            #0a0a0a
foreground             #c8c8c8
cursor                  #ff3333
cursor_text_color      #000000
selection_background    #cc2222
selection_foreground    #ffffff
url_color               #ff453a

